name: Deploy to ECS

on:
  workflow_run:
    workflows:
      - CI for TakeIt Services
    types:
      - completed

  workflow_dispatch:
    inputs:
      service:
        description: 'Select a service to deploy'
        required: false
        default: ''
        type: choice
        options:
          - eureka-server
          - gateway
          - auth-service
          - order-service
          - product-service
          - payment-service
          - review-service
          - coupon-service
          - favorite-service

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.determine-services.outputs.services }}

    steps:
      - name: Determine services to deploy
        id: determine-services
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.service }}" == "" ]]; then
              echo "services=[]" >> $GITHUB_OUTPUT
            else
              echo "services=[\"${{ github.event.inputs.service }}\"]" >> $GITHUB_OUTPUT
            fi
          else
            if [[ "${{ github.event.workflow_run.outputs.services }}" == "" ]]; then
              echo "services=[\"none\"]" >> $GITHUB_OUTPUT
            else
              echo "services=${{ github.event.workflow_run.outputs.services }}" >> $GITHUB_OUTPUT
            fi
          fi

  deploy:
    needs: prepare
    if: ${{ needs.prepare.outputs.services != '["none"]' }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup SSH for Bastion
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: |
            ${{ secrets.NEW_BASTION_SSH_KEY }}

      - name: Deploy via Bastion
        run: |
          ssh -o StrictHostKeyChecking=no -A ${{ secrets.NEW_BASTION_USER }}@${{ secrets.NEW_BASTION_HOST }} << 'EOF'
            set -e
            cd /efs/take-it-backend
            sudo git fetch origin dev
            sudo git reset --hard origin/dev
            echo "Deploying ${{ matrix.service }}..."
            copilot svc deploy --name ${{ matrix.service }} --env prod --force
          EOF