name: CI for TakeIt Services

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'eureka-server/**'
      - 'gateway/**'
      - 'auth-service/**'
      - 'order-service/**'
      - 'product-service/**'
      - 'payment-service/**'
      - 'review-service/**'
      - 'coupon-service/**'
      - 'favorite-service/**'

  # 수동 실행 트리거
  workflow_dispatch:
    inputs:
      service:
        description: 'Select a service to build and deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - eureka-server
          - gateway
          - auth-service
          - order-service
          - product-service
          - payment-service
          - review-service
          - coupon-service
          - favorite-service

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-changed-services.outputs.services }}

    steps:
      # 1️⃣ 레포지토리 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2️⃣ 변경된 서비스 감지 or 수동 실행
      - name: Detect Changed Services or Use Manual Input
        id: set-changed-services
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.service }}" == "all" ]]; then
              echo "services=[\"eureka-server\", \"gateway\", \"auth-service\", \"order-service\", \"product-service\", \"payment-service\", \"review-service\", \"coupon-service\", \"favorite-service\"]" >> $GITHUB_OUTPUT
            else
              echo "services=[\"${{ github.event.inputs.service }}\"]" >> $GITHUB_OUTPUT
            fi
          else
            CHANGED_SERVICES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -Eo '^(eureka-server|gateway|auth-service|order-service|product-service|payment-service|review-service|coupon-service|favorite-service)' | sort -u | jq -R -s -c 'split("\n")[:-1]')
          
            if [[ -z "$CHANGED_SERVICES" ]]; then
              echo "services=[]" >> $GITHUB_OUTPUT
            else
              echo "services=$CHANGED_SERVICES" >> $GITHUB_OUTPUT
            fi
          fi

  build-and-push:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

    steps:
      # 1️⃣ 레포지토리 체크아웃
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2️⃣ JDK 17 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3️⃣ Gradle 캐시 설정
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 4️⃣ Gradle 빌드
      - name: Build with Gradle
        run: |
          ./gradlew :${{ matrix.service }}:clean :${{ matrix.service }}:build -x test --info

      # 5️⃣ Docker Buildx 설정 추가
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 6️⃣ Docker Hub 로그인
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 7️⃣ Docker 이미지 빌드 및 푸시
      - name: Build and Push Docker Image
        run: |
          SERVICE_PORT=$(case ${{ matrix.service }} in
            eureka-server) echo 19090 ;;
            gateway) echo 19091 ;;
            auth-service) echo 19092 ;;
            order-service) echo 19093 ;;
            product-service) echo 19094 ;;
            payment-service) echo 19095 ;;
            review-service) echo 19096 ;;
            coupon-service) echo 19097 ;;
            favorite-service) echo 19098 ;;
          esac)
          
          IMAGE_NAME="gogohaena/takeit-${{ matrix.service }}"
          
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg SERVICE_NAME=${{ matrix.service }} \
            --build-arg SERVICE_PORT=${SERVICE_PORT} \
            -t ${IMAGE_NAME}:latest \
            --push .