# The manifest for the "grafana" service.
# Read the full specification for the "Backend Service" type at:
#  https://aws.github.io/copilot-cli/docs/manifest/backend-service/

# Your service name will be used in naming your resources like log groups, ECS services, etc.
name: grafana
type: Load Balanced Web Service

# Your service is reachable at "http://grafana.${COPILOT_SERVICE_DISCOVERY_ENDPOINT}:3000" but is not public.

# Configuration for your containers and service.
image:
  location: grafana/grafana:latest
  # Port exposed through your container to route traffic to it.
  port: 3000

# Distribute traffic to your service.
http:
  # Requests to this path will be forwarded to your service.
  # To match all requests you can use the "/" path.
  path: '/'
  # You can specify a custom health check path. The default is "/".
  healthcheck:
    path: '/'
    success_codes: '200-499'
    healthy_threshold: 3
    interval: 15s
    timeout: 10s
    grace_period: 30s
  deregistration_delay: 50s

cpu: 256       # Number of CPU units for the task.
memory: 512    # Amount of memory in MiB used by the task.
count: 1       # Number of tasks that should be running in your service.
exec: true     # Enable running commands in your container.
network:
  connect: true # Enable Service Connect for intra-environment traffic between services.

storage:
  volumes:
    config:
      path: "/etc/grafana/provisioning/datasources" # 컨테이너 내 경로
      read_only: false
      efs:
        id: fs-0a5dadfb97eaaf819
        root_dir: "/grafana/config"
    data:
      path: "/var/lib/grafana" # 컨테이너 내 경로
      read_only: false
      efs:
        id: fs-0a5dadfb97eaaf819
        root_dir: "/grafana/data"

variables:                        # 환경 변수 설정
  GF_SECURITY_ADMIN_USER: admin
  GF_SECURITY_ADMIN_PASSWORD: admin
  GF_PATHS_PROVISIONING: /etc/grafana/provisioning
  GF_AUTH_ANONYMOUS_ENABLED: "true"
  GF_AUTH_ANONYMOUS_ORG_ROLE: Admin

# 명령어 및 추가 설정
entrypoint: ["sh", "-euc", "/run.sh"]

# Optional fields for more advanced use-cases.
