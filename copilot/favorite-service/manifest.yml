# The manifest for the "favorite-service" service.
# Read the full specification for the "Backend Service" type at:
#  https://aws.github.io/copilot-cli/docs/manifest/backend-service/

# Your service name will be used in naming your resources like log groups, ECS services, etc.
name: favorite-service
type: Backend Service

# Your service is reachable at "http://favorite-service.${COPILOT_SERVICE_DISCOVERY_ENDPOINT}:19098" but is not public.

# Configuration for your containers and service.
image:
  location: gogohaena/takeit-favorite-service:latest
  # Port exposed through your container to route traffic to it.
  port: 19098

cpu: 1024       # Number of CPU units for the task.
memory: 2048    # Amount of memory in MiB used by the task.
count: 1       # Number of tasks that should be running in your service.
exec: true     # Enable running commands in your container.
network:
  connect: true # Enable Service Connect for intra-environment traffic between services.

storage:
  volumes:
    config:
      path: "/config" # 컨테이너 내 경로
      read_only: false
      efs:
        id: fs-0a5dadfb97eaaf819
        root_dir: "/favorite-service/config"

variables:
  SPRING_PROFILES_ACTIVE: prod

secrets:
  EUREKA_SERVER_URL: /copilot/takeit/prod/secrets/EUREKA_SERVER_URL
  FAVORITE_DB_URL: /copilot/takeit/prod/secrets/FAVORITE_DB_URL
  FAVORITE_DB_USERNAME: /copilot/takeit/prod/secrets/FAVORITE_DB_USERNAME
  FAVORITE_DB_PASSWORD: /copilot/takeit/prod/secrets/FAVORITE_DB_PASSWORD
  FAVORITE_DDL_AUTO: /copilot/takeit/prod/secrets/FAVORITE_DDL_AUTO
  FAVORITE_SERVICE_PORT: /copilot/takeit/prod/secrets/FAVORITE_SERVICE_PORT
  ZIPKIN_ENDPOINT: /copilot/takeit/prod/secrets/ZIPKIN_ENDPOINT

# You can override any of the values defined above by environment.
#environments:
#  test:
#    count: 2               # Number of tasks to run for the "test" environment.
#    deployment:            # The deployment strategy for the "test" environment.
#       rolling: 'recreate' # Stops existing tasks before new ones are started for faster deployments.