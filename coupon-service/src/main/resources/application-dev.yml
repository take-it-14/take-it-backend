spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    username: takeit_coupon
    password: takeit_coupon
    url: jdbc:postgresql://postgres:5432/takeit_coupon

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        default_batch_fetch_size: 10
    open-in-view: false

server:
  port: 19097

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:19090/eureka/

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: "http://zipkin:9411/api/v2/spans"
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true

logging:
  level:
    root: debug
    com.takeit: debug
    org.springframework: warn