spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    username: takeit_coupon
    password: takeit_coupon
    url: jdbc:postgresql://postgres:5432/takeit_coupon

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        default_batch_fetch_size: 10
    open-in-view: false

server:
  port: 19097

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:19090/