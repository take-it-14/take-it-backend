spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:15432/takeit_auth
    username: takeit_auth
    password: takeit_auth
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
        hibernate.type:
          trace: true # SQL에 바인딩된 파라미터 값을 출력
        default_batch_fetch_size: 100
    open-in-view: false

logging:
  level:
    org.hibernate.type.descriptor.sql: trace
    org.hibernate.SQL: trace

server:
  port: 19092

eureka:
  client:
    service-url:
      defaultZone: http://localhost:19090/eureka/

service:
  jwt:
    access-expiration: 360000
    secret-key: "401b09eab3c013d4ca54922bb802bec8fd5318192b0a75f201d8b3727429080fb337591abd3e44453b954555b7a0812e1081c39b740293f765eae731f5a65ed1"

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans"
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true