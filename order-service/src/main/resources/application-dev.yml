spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/takeit_order
    username: takeit_order
    password: takeit_order
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 19098

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:19090/eureka/