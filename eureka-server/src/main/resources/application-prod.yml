spring:
  application:
    name: eureka-server

server:
  port: ${EUREKA_SERVER_PORT}

eureka:
  client:
    register-with-eureka: false  # 다른 Eureka 서버에 등록하지 않음
    fetch-registry: false        # 다른 Eureka 서버에서 레지스트리를 불러오지 않음
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}
  instance:
    hostname: ${EUREKA_HOSTNAME}
    prefer-ip-address: false # IP 주소 대신 호스트 이름 사용

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT}
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true

logging:
  level:
    root: info
    com.takeit: info
    org.springframework: warn
