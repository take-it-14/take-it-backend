spring:
  application:
    name: eureka-server

server:
  port: 19090

eureka:
  client:
    register-with-eureka: false  # 다른 Eureka 서버에 등록하지 않음
    fetch-registry: false        # 다른 Eureka 서버에서 레지스트리를 불러오지 않음
    service-url:
      defaultZone: http://eureka-server:19090/eureka/
  instance:
    hostname: eureka-server

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: "http://zipkin:9411/api/v2/spans"
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true

logging:
  level:
    root: debug
    com.takeit: debug
    org.springframework: warn